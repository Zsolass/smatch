<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Figtree"; src: url("/node_modules/@fontsource-variable/figtree/files/figtree-latin-wght-normal.woff2") format("woff2"); font-weight: 300 900; }
  @font-face { font-family: "Fraunces"; src: url("/node_modules/@fontsource-variable/fraunces/files/fraunces-latin-opsz-normal.woff2") format("woff2"); font-weight: 100 900; }

  * { margin: 0; box-sizing: border-box; }
  body { background: transparent; }
  #og { width: 1200px; height: 630px; position: relative; overflow: hidden; background: #f7f2e8; color: #22272a; font-family: Figtree, sans-serif; }
  #og .arch { position: absolute; right: 70px; top: 62px; width: 404px; height: 506px; border-radius: 999px 999px 28px 28px; overflow: hidden; background: #13241f; box-shadow: 0 30px 60px -28px rgba(28,34,30,.45); }
  #og .arch img { width: 100%; height: 100%; object-fit: cover; }
  #og .text { position: absolute; left: 76px; top: 0; bottom: 0; width: 620px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 16px; font-family: Fraunces, serif; font-size: 30px; letter-spacing: -0.01em; }
  .brand img { width: 56px; height: 56px; }
  h1 { margin-top: 46px; font-family: Fraunces, serif; font-size: 80px; line-height: 1.03; letter-spacing: -0.025em; font-weight: 380; }
  em { font-weight: 360; color: #1f4d3f; }
  p { margin-top: 28px; font-size: 25px; line-height: 1.4; color: #5b625f; max-width: 560px; }
  .pill { margin-top: 34px; display: inline-flex; align-self: flex-start; gap: 10px; align-items: center; padding: 10px 20px; border-radius: 999px; background: #13241f; font-size: 20px; font-weight: 600; color: rgba(255,255,255,0.9); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #a9b9a1; }

</style>
</head>
<body>
  <div id="og">
    <div class="arch"><img src="/public/images/hero-1500.webp" alt=""></div>
    <div class="text">
      <div class="brand"><img src="/public/clinic/logo-mark.svg" alt="">Smatch Demo Dental</div>
      <h1>Dentistry that starts with <em>listening</em>.</h1>
      <p>A demo dental clinic website: treatments, results, fees and a consultation request.</p>
      <span class="pill"><span class="dot"></span>Demo website by Smatch</span>
    </div>
  </div>
  <div id="icon">
    <svg viewBox="8 8 24 24" width="124" height="124"><path d="M12 29.5V19a8 8 0 0 1 16 0v10.5" fill="none" stroke="#f7f2e8" stroke-width="2.8" stroke-linecap="round"/><path d="M16.2 25c2.3 1.9 5.3 1.9 7.6 0" fill="none" stroke="#a9b9a1" stroke-width="2.4" stroke-linecap="round"/></svg>
  </div>
