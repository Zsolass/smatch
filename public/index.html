<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LabSites – Websites for dental labs</title>
  <meta name="description" content="Modern, affordable websites built for dental laboratories.">
  <style>
    :root { color-scheme: light dark; --bg: #f7f9fb; --fg: #0f1b2d; --muted: #5a6b80; --accent: #0e7c86; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0d1520; --fg: #e8eef5; --muted: #9aabbe; --accent: #3cc4cf; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
           background: var(--bg); color: var(--fg);
           font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 560px; text-align: center; }
    .mark { font-weight: 700; letter-spacing: .02em; color: var(--accent); }
    h1 { font-size: clamp(2rem, 6vw, 3rem); line-height: 1.15; margin: .4em 0; }
    p { color: var(--muted); margin: 0; }
  </style>
</head>
<body>
  <main>
    <div class="mark">LabSites</div>
    <h1>Websites for dental labs</h1>
    <p>Something new is on the way. Check back soon.</p>
  </main>
</body>
</html>
